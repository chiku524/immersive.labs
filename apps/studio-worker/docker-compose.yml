# Local smoke (repo root):
#   docker compose -f apps/studio-worker/docker-compose.yml up --build
#
# Default: split API vs queue consumer (recommended — avoids 502s when Ollama/Comfy block the API).
# Single-process fallback: STUDIO_EMBEDDED_QUEUE_WORKER=1 and stop studio-queue-worker.
#
# STUDIO_CORS_ORIGINS: comma-separated. STUDIO_COMFY_URL for local ComfyUI override.

services:
  studio-worker:
    build:
      context: ../..
      dockerfile: apps/studio-worker/Dockerfile
    ports:
      - "8787:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STUDIO_COMFY_URL: ${STUDIO_COMFY_URL:-http://host.docker.internal:8188}
      STUDIO_CORS_ORIGINS: ${STUDIO_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      STUDIO_EMBEDDED_QUEUE_WORKER: ${STUDIO_EMBEDDED_QUEUE_WORKER:-0}
    volumes:
      - studio_output:/repo/apps/studio-worker/output

  studio-queue-worker:
    build:
      context: ../..
      dockerfile: apps/studio-worker/Dockerfile
    command: ["immersive-studio", "queue-worker", "--worker-id", "compose-q"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STUDIO_COMFY_URL: ${STUDIO_COMFY_URL:-http://host.docker.internal:8188}
      STUDIO_EMBEDDED_QUEUE_WORKER: "0"
    volumes:
      - studio_output:/repo/apps/studio-worker/output
    depends_on:
      - studio-worker

volumes:
  studio_output:
